name: Test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Test and check coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          awk '/^total:/ { found=1; if (($NF+0) < 90) exit 1 } END { if (!found) exit 1 }' coverage.txt
      - name: Verify the bind mount from a container
        run: |
          CGO_ENABLED=0 go build -o /tmp/vm-sandbox .
          docker pull alpine:3.22
          VM_SANDBOX_CONTAINER_TEST_BINARY=/tmp/vm-sandbox go test -run '^TestSandboxInfoOverStdio$' -count=1 ./...
      - name: Verify the development image
        run: |
          docker build -t vm-sandbox-dev -f .devcontainer/Dockerfile .devcontainer
          docker run --rm --user developer -v "${PWD}:/workspace:ro" -w /workspace vm-sandbox-dev go test -race ./...
      - name: Build Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper
          scripts/build-package
      - name: Verify package install and removal
        run: scripts/test-package dist/vm-sandbox_*.deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: vm-sandbox-deb
          path: dist/*.deb
